version: '3.8'

services:
  # Keycloak Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: bistun-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://bistun-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      - bistun-postgres
    command: start-dev
    networks:
      - bistun-network

  # Global PostgreSQL Database
  bistun-postgres:
    image: postgres:15
    container_name: bistun-postgres
    environment:
      POSTGRES_DB: bistun_global
      POSTGRES_USER: bistun_admin
      POSTGRES_PASSWORD: bistun123
      POSTGRES_MULTIPLE_DATABASES: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - bistun-network

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: bistun-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: bistun
      KEYCLOAK_CLIENT_ID: bistun-auth-service
      KEYCLOAK_CLIENT_SECRET: your-client-secret
      DATABASE_URL: postgresql://bistun_admin:bistun123@bistun-postgres:5432/bistun_global
    ports:
      - "3001:3001"
    depends_on:
      - keycloak
      - bistun-postgres
    networks:
      - bistun-network

  # Database Gateway
  db-gateway:
    build: ./db-gateway
    container_name: bistun-db-gateway
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://bistun_admin:bistun123@bistun-postgres:5432/bistun_global
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: bistun
    ports:
      - "3002:3002"
    depends_on:
      - auth-service
      - bistun-postgres
    networks:
      - bistun-network

  # Admin Dashboard
  admin-dashboard:
    build: ./admin-dashboard
    container_name: bistun-admin-dashboard
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: bistun
      REACT_APP_KEYCLOAK_CLIENT_ID: bistun-admin-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
    networks:
      - bistun-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: bistun-redis
    ports:
      - "6379:6379"
    networks:
      - bistun-network

volumes:
  postgres_data:

networks:
  bistun-network:
    driver: bridge